<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      Govind Kumar | MERN Stack Developer | React Developer
    </title>

    <meta
      name="description"
      content="Govind Kumar is a MERN Stack Developer specializing in React.js, JavaScript, Tailwind CSS, Node.js, Express.js and MongoDB. Explore his projects, skills and web development portfolio."
    />

    <meta
      name="keywords"
      content="Govind Kumar, MERN Stack Developer, React Developer, Frontend Developer, JavaScript Developer, React.js, Node.js, MongoDB, Tailwind CSS, Web Developer"
    />

    <meta name="author" content="Govind Kumar" />

    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://yourdomain.com/"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Govind Kumar | MERN Stack Developer"
    />

    <meta
      property="og:description"
      content="Explore Govind Kumar's MERN Stack development portfolio, projects, skills and experience."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://yourdomain.com/"
    />

    <meta
      property="og:image"
      content="https://yourdomain.com/og-image.jpg"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#0f172a"
    />

    <link rel="icon" href="/favicon.ico" />

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
